{
  "job_title": "Illumina - demultiplex; mergepair-vsearch; chimera-vsearch; remove-ambiguous-reads; swarm3",
  "0": {
    "name": "demultiplexer",
    "params": {
      "inputs": {
        "tags": "",
        "primers": ""
      },
      "outputs": {
        "tag_to_sample*_fwd.fastq": "tag_to_sample*_fwd.fastq",
        "tag_to_sample*_rev.fastq": "tag_to_sample*_rev.fastq"
      },
      "params": {
        "trim_end": false,
        "trim_length": "1",
        "mistags": false,
        "errors": "0"
      }
    }
  },
  "1": {
    "name": "mergepair-vsearch",
    "params": {
      "inputs": {
        "fwd": "tag_to_sample*_fwd.fastq",
        "rev": "tag_to_sample*_rev.fastq"
      },
      "outputs": {
        "assembly": "tag_to_sample*_merge-vsearch.fasta"
      },
      "params": {
        "min_qual": "0",
        "max_qual": "41",
        "min_size": "1",
        "max_size": "1000",
        "max_diff": "5",
        "min_overlap": "16"
      }
    }
  },
  "2": {
    "name": "chimera-vsearch",
    "params": {
      "inputs": {
        "input": "tag_to_sample*_merge-vsearch.fasta"
      },
      "outputs": {
        "nonchimeras": "tag_to_sample*_merge-vsearch_uchime.fasta"
      },
      "params": {}
    }
  },
  "3": {
    "name": "fasta-remove-ambiguous-reads",
    "params": {
      "inputs": {
        "fasta": "tag_to_sample*_merge-vsearch_uchime.fasta"
      },
      "outputs": {
        "cleaned": "tag_to_sample*_merge-vsearch_uchime_noN.fasta"
      },
      "params": {}
    }
  },
  "4": {
    "name": "swarm3",
    "params": {
      "inputs": {
        "list_0_0": "tag_to_sample$_merge-vsearch_uchime_noN.fasta"
      },
      "outputs": {
        "otus_table": "otus-swarm.tsv",
        "centroids": "representative-swarm.fasta",
        "reads": "clustered-reads-swarm.fasta"
      },
      "params": {
        "ordered_swarm": false,
        "t2s": "",
        "max_diff": "1"
      }
    }
  }
}
